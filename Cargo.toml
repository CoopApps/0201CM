[workspace]
resolver = "2"
members = [
    "crates/cm-rng",
    "crates/cm-data",
    "crates/cm-events",
    "crates/cm-domain",
    "crates/cm-app",
    "crates/cm-gui",
    # UI consolidated from D:/0201CM (archived there 2026-08-20):
    "crates/cm-render",
    "crates/cm-widget",
    "crates/cm-ui-app",
    # Native Rust database (one-time import from the CM install's .dat files):
    "crates/cm-db",
    "crates/cm-import",
]

# CM0102 clean-room reimplementation — verified pieces only.
# Each crate cites the carve finding it was lifted from (D:/cm0102-carve).
# VERIFIED = bit-exact / code-derived. INFERRED items are marked in-source.
[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

# Build cm-domain (a single ~22k-line lib.rs) without debug info: its LLVM
# codegen with full debug info OOMs on low-RAM hosts (see the OOM note). Scoped
# to this one crate so every other crate — including the GUI's windows-sys,
# whose GNU dlltool import-lib build is broken here — keeps the default profile
# and reuses its cache instead of rebuilding. Runtime speed is unaffected (still
# an unoptimized dev build); only cm-domain backtraces lose line numbers.
[profile.dev.package.cm-domain]
debug = 0
