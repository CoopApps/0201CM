[package]
name = "cm-db"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "The native CM0102-rs database facade: opens rust-db/ (imported once from the original install by cm-import) and hands out typed tables. The game runs from this — the CM install is not needed at runtime."

[dependencies]
cm-domain = { path = "../cm-domain" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
