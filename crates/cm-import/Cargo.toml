[package]
name = "cm-import"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "One-time importer / verifier: reads an original CM01/02 install's Data/*.dat and (re)generates the native rust-db database. Run once; the game never touches .dat files again."

[dependencies]
cm-domain = { path = "../cm-domain" }
cm-data = { path = "../cm-data" }
cm-db = { path = "../cm-db" }
cm-rng = { path = "../cm-rng" }
cm-render = { path = "../cm-render" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[[bin]]
name = "cm-import"
path = "src/main.rs"

[[bin]]
name = "rng-check"
path = "src/bin/rng_check.rs"

[[bin]]
name = "decode-check"
path = "src/bin/decode_check.rs"

[[bin]]
name = "newgame-check"
path = "src/bin/newgame_check.rs"

[[bin]]
name = "newgame-tiers"
path = "src/bin/newgame_tiers.rs"
[[bin]]
name = "pa-rng"
path = "src/bin/pa_rng.rs"

[[bin]]
name = "clubs-check"
path = "src/bin/clubs_check.rs"

[[bin]]
name = "dash-check"
path = "src/bin/dash_check.rs"

[[bin]]
name = "comp-counts"
path = "src/bin/comp_counts.rs"

[[bin]]
name = "export-club-comp"
path = "src/bin/export_club_comp.rs"

[[bin]]
name = "regen_type10"
path = "src/bin/regen_type10.rs"

[[bin]]
name = "regen_type6"
path = "src/bin/regen_type6.rs"

[[bin]]
name = "regen_type9"
path = "src/bin/regen_type9.rs"

[[bin]]
name = "regen_clubs"
path = "src/bin/regen_clubs.rs"

[[bin]]
name = "regen_simple"
path = "src/bin/regen_simple.rs"

[[bin]]
name = "c15_year_end_diff"
path = "src/bin/c15_year_end_diff.rs"

[[bin]]
name = "season_check"
path = "src/bin/season_check.rs"

[[bin]]
name = "dump_fixtures"
